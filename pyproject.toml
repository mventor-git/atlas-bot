[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-bot"
version = "2.0.0a1"
description = "Atlas-Bot - Telegram-based construction daily labor tracker with period contractor reports (Excel templates now, LibreOffice roadmap)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
authors = [
    {name = "Atlas-Bot Contributors"}
]
keywords = ["telegram", "construction", "contractor", "daily-report", "labor", "excel", "pdf"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Construction",
]
dependencies = [
    "python-telegram-bot>=21.0,<22.0",
    "odfpy>=1.4,<2.0",
    "PyYAML>=6.0,<7.0",
    "pydantic>=2.0,<3.0",
    "python-dotenv>=1.0,<2.0",
    "pandas>=2.0,<3.0",
    "psycopg2-binary>=2.9,<3.0",
    # Document engine above (odfpy fill + headless soffice PDF).
    # Atlas opencode-serve agent dep TBD - do not add yet.
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0,<6.0",
    "pytest-mock>=3.0,<4.0",
    "pytest-asyncio>=0.23,<2.0",
]

[project.scripts]
atlas-bot = "main:main"
contractor-bot = "main:main"  # legacy alias

[project.urls]
Homepage = "https://github.com/mventor-git/atlas-bot"
Documentation = "https://github.com/mventor-git/atlas-bot#readme"
Repository = "https://github.com/mventor-git/atlas-bot"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "config*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    'if __name__ == .__main__.:',
]
